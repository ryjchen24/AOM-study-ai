<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMO</title>
<meta name="viewport" content="width=1280" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- Rich message rendering: GFM markdown (marked), math (KaTeX), HTML sanitizer (DOMPurify). -->
<link rel="stylesheet" href="https://unpkg.com/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script src="https://unpkg.com/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://unpkg.com/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<style>
  :root {
    /* Light theme tokens */
    --bg: oklch(99% 0.004 180);
    --surface: oklch(100% 0 0);
    --surface-2: oklch(97.5% 0.005 180);
    --surface-3: oklch(95% 0.006 180);
    --border: oklch(91% 0.008 180);
    --border-strong: oklch(85% 0.01 180);
    --text: oklch(22% 0.01 180);
    --text-muted: oklch(48% 0.012 180);
    --text-faint: oklch(65% 0.012 180);
    --accent: oklch(48% 0.07 180);
    --accent-soft: oklch(94% 0.025 180);
    --accent-text: oklch(36% 0.07 180);
    --danger: oklch(58% 0.18 27);
    --warn: oklch(74% 0.14 75);
    --ok: oklch(60% 0.13 155);

    /* Folder colors */
    --c-teal: oklch(58% 0.09 180);
    --c-blue: oklch(58% 0.12 235);
    --c-violet: oklch(58% 0.13 290);
    --c-rose: oklch(64% 0.13 15);
    --c-amber: oklch(72% 0.13 75);
    --c-green: oklch(62% 0.12 145);
    --c-slate: oklch(55% 0.02 250);
    --c-coral: oklch(66% 0.14 35);

    --radius-sm: 6px;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow-pop: 0 1px 2px oklch(0% 0 0 / 0.04), 0 8px 24px oklch(0% 0 0 / 0.06);
  }
  [data-theme="dark"] {
    --bg: oklch(18% 0.008 220);
    --surface: oklch(21% 0.008 220);
    --surface-2: oklch(24% 0.008 220);
    --surface-3: oklch(28% 0.01 220);
    --border: oklch(30% 0.01 220);
    --border-strong: oklch(38% 0.012 220);
    --text: oklch(96% 0.005 220);
    --text-muted: oklch(70% 0.01 220);
    --text-faint: oklch(55% 0.012 220);
    --accent: oklch(65% 0.1 180);
    --accent-soft: oklch(30% 0.04 180);
    --accent-text: oklch(82% 0.09 180);
    --shadow-pop: 0 1px 2px oklch(0% 0 0 / 0.4), 0 8px 24px oklch(0% 0 0 / 0.4);
  }

  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }
  input, textarea { font-family: inherit; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

  /* App shell */
  .app { display: flex; height: 100vh; width: 100vw; background: var(--bg); }

  /* === SIDEBAR === */
  .sidebar {
    position: relative;
    display: flex; flex-direction: column;
    flex-shrink: 0;
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    height: 100vh;
  }
  .sb-resize {
    position: absolute; top: 0; right: -2px; width: 6px; height: 100%;
    cursor: col-resize; z-index: 10;
  }
  .sb-resize::after {
    content: ""; position: absolute; top: 0; left: 2px; width: 1px; height: 100%;
    background: transparent; transition: background 120ms;
  }
  .sb-resize:hover::after, .sb-resize.dragging::after { background: var(--accent); }

  .sb-top { padding: 14px 12px 8px; }
  .sb-logo { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; }
  .sb-logo-text {
    font-family: 'Poppins', 'Inter', sans-serif;
    font-weight: 700; letter-spacing: -0.01em; font-size: 18px;
  }

  .new-chat {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-weight: 500; font-size: 14px;
    color: var(--text);
    transition: background 120ms, border-color 120ms;
  }
  .new-chat:hover { background: var(--surface-3); border-color: var(--border-strong); }
  .new-chat .kbd {
    margin-left: auto; font-size: 10.5px; color: var(--text-faint);
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
  }

  .sb-tabs {
    display: flex; gap: 2px; padding: 12px 12px 6px;
  }
  .sb-tab {
    flex: 1; padding: 8px 12px; font-size: 13.5px; font-weight: 500;
    color: var(--text-muted); border-radius: var(--radius-sm);
    transition: background 120ms, color 120ms;
  }
  .sb-tab:hover { background: var(--surface-3); color: var(--text); }
  .sb-tab.active { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); }

  .sb-body { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
  .sb-body::-webkit-scrollbar { width: 8px; }
  .sb-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .sb-body::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

  .sb-section-label {
    font-size: 12px; font-weight: 500; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 12px 8px 6px;
  }

  .chat-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; margin: 2px 0;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text);
    font-size: 14px;
    position: relative;
    transition: background 100ms;
  }
  .chat-row:hover { background: var(--surface-3); }
  .chat-row.active { background: var(--accent-soft); color: var(--accent-text); }
  .chat-row .dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .chat-row .title { flex: 1; min-width: 0; }
  .chat-row .actions { display: none; gap: 2px; }
  .chat-row:hover .actions { display: flex; }
  .chat-row .icon-btn {
    width: 25px; height: 25px; display: grid; place-items: center;
    border-radius: 4px; color: var(--text-faint);
  }
  .chat-row .icon-btn:hover { background: var(--surface); color: var(--text); }

  /* Folder rows */
  .folder-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; margin: 2px 0;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    transition: background 100ms;
  }
  .folder-row:hover { background: var(--surface-3); }
  .folder-row .chev {
    width: 14px; height: 14px; flex-shrink: 0;
    color: var(--text-faint);
    transition: transform 150ms;
  }
  .folder-row.open .chev { transform: rotate(90deg); }
  .folder-row .fld-icon { flex-shrink: 0; }
  .folder-row .name { flex: 1; min-width: 0; font-weight: 500; }
  .folder-row .actions { display: none; gap: 2px; margin-right: 2px; }
  .folder-row:hover .actions { display: flex; }
  .folder-row:hover .count { display: none; }
  .folder-row .icon-btn {
    width: 25px; height: 25px; display: grid; place-items: center;
    border-radius: 4px; color: var(--text-faint);
  }
  .folder-row .icon-btn:hover { background: var(--surface); color: var(--text); }
  .folder-row .count {
    font-size: 12px; color: var(--text-faint);
    background: var(--surface); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .folder-children { padding-left: 22px; }
  .folder-children .chat-row { padding-left: 8px; }

  .new-folder-btn {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 9px 10px;
    border-radius: var(--radius-sm);
    color: var(--text-muted); font-size: 14px;
    margin-top: 8px;
    transition: background 100ms, color 100ms;
  }
  .new-folder-btn:hover { background: var(--surface-3); color: var(--text); }

  .sb-bottom {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    flex-shrink: 0;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px oklch(60% 0.13 155 / 0.18);
    flex-shrink: 0;
  }
  .sb-bottom .model-name {
    font-size: 13px; color: var(--text-muted);
    flex: 1; min-width: 0;
  }
  .sb-bottom .icon-btn {
    width: 30px; height: 30px; display: grid; place-items: center;
    border-radius: var(--radius-sm); color: var(--text-muted);
  }
  .sb-bottom .icon-btn:hover { background: var(--surface-3); color: var(--text); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 600; color: white;
    background: var(--c-coral);
    flex-shrink: 0;
  }

  /* === MAIN === */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 22px; height: 58px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }
  .topbar-title {
    font-size: 15px; font-weight: 600; color: var(--text);
    padding: 4px 6px; border-radius: 4px;
    cursor: text;
    max-width: 320px;
  }
  .topbar-title:hover { background: var(--surface-3); }
  .topbar-title input {
    border: 0; outline: 0; background: var(--surface);
    font-weight: 600; font-size: 14px; color: var(--text);
    box-shadow: 0 0 0 2px var(--accent-soft);
    border-radius: 4px;
    padding: 4px 6px;
    width: 320px;
  }
  .folder-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 3px 9px 3px 8px;
    border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    transition: background 120ms;
  }
  .folder-pill:hover { background: var(--surface-3); }
  .folder-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .topbar-spacer { flex: 1; }

  .topbar-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 14px;
    border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500; color: var(--text);
    border: 1px solid var(--border);
    background: var(--surface);
    transition: background 120ms;
  }
  .topbar-btn:hover { background: var(--surface-3); }
  .topbar-btn.icon-only { padding: 0; width: 34px; justify-content: center; }
  .topbar-btn.primary {
    background: var(--accent); color: white; border-color: var(--accent);
  }
  .topbar-btn.primary:hover { filter: brightness(1.05); }

  .model-select {
    position: relative;
  }
  .model-menu {
    position: absolute; right: 0; top: calc(100% + 6px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius);
    min-width: 240px; padding: 4px;
    box-shadow: var(--shadow-pop);
    z-index: 50;
  }
  .model-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: var(--radius-sm);
    font-size: 13px; cursor: pointer;
  }
  .model-item:hover { background: var(--surface-3); }
  .model-item .check { width: 14px; color: var(--accent); }
  .model-item .desc { font-size: 11px; color: var(--text-faint); margin-left: auto; }

  /* === FILES VIEW === */
  .files-view {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
  }
  .files-toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 30px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .breadcrumb .seg {
    color: var(--text-muted);
    cursor: pointer; padding: 3px 6px; border-radius: 4px;
  }
  .breadcrumb .seg:hover { background: var(--surface-3); color: var(--text); }
  .breadcrumb .seg.current { color: var(--text); font-weight: 500; cursor: default; }
  .breadcrumb .seg.current:hover { background: transparent; }
  .breadcrumb .sep { color: var(--text-faint); font-size: 11px; }

  .files-toolbar .search {
    display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 14px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 260px;
    transition: border-color 120ms, width 200ms;
  }
  .files-toolbar .search:focus-within {
    border-color: var(--accent); width: 340px;
    background: var(--surface);
  }
  .files-toolbar .search input {
    border: 0; outline: 0; background: transparent;
    flex: 1; font-size: 13px; color: var(--text);
  }
  .files-toolbar .search input::placeholder { color: var(--text-faint); }

  .seg-toggle {
    display: inline-flex; padding: 2px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .seg-toggle button {
    width: 34px; height: 30px; display: grid; place-items: center;
    border-radius: 5px;
    color: var(--text-muted);
  }
  .seg-toggle button.active { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); }

  .files-body {
    flex: 1; overflow-y: auto;
    padding: 24px 32px 84px;
  }
  .files-body::-webkit-scrollbar { width: 10px; }
  .files-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  .files-section-label {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 18px 0 12px;
  }
  .files-section-label:first-child { margin-top: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .card {
    position: relative;
    display: flex; flex-direction: column; gap: 6px;
    padding: 17px; min-height: 126px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: border-color 120ms, transform 120ms, box-shadow 120ms;
  }
  .card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-pop); }
  .card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .card.drop-target { border-color: var(--accent); border-style: dashed; background: var(--accent-soft); }

  .card .checkbox {
    position: absolute; top: 10px; left: 10px;
    width: 16px; height: 16px;
    border: 1.5px solid var(--border-strong);
    border-radius: 4px;
    background: var(--surface);
    display: grid; place-items: center;
    opacity: 0;
    transition: opacity 120ms;
  }
  .card:hover .checkbox, .card.selected .checkbox { opacity: 1; }
  .card.selected .checkbox {
    background: var(--accent); border-color: var(--accent);
    color: white;
  }

  .card-actions {
    position: absolute; top: 8px; right: 8px;
    display: flex; gap: 2px;
    opacity: 0;
    transition: opacity 120ms;
  }
  .card:hover .card-actions { opacity: 1; }
  .card-actions button {
    width: 24px; height: 24px; display: grid; place-items: center;
    border-radius: 5px;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .card-actions button:hover { background: var(--surface-3); color: var(--text); }

  .card-icon {
    width: 42px; height: 42px;
    border-radius: 8px;
    display: grid; place-items: center;
    margin-top: 4px;
  }
  .card-folder-icon { background: transparent; }

  .card-title {
    font-size: 14px; font-weight: 500; color: var(--text);
    line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: auto;
  }
  .card-meta {
    font-size: 12.5px; color: var(--text-faint);
    display: flex; align-items: center; gap: 6px;
  }
  .card-folder-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; padding: 2px 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-muted);
  }
  .card-folder-badge .dot { width: 6px; height: 6px; border-radius: 50%; }

  /* List view */
  .list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .list-row {
    display: grid;
    grid-template-columns: 32px 28px 1fr 160px 130px 90px 80px;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 100ms;
  }
  .list-row:last-child { border-bottom: 0; }
  .list-row:hover { background: var(--surface-2); }
  .list-row.header {
    background: var(--surface-2);
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
    cursor: default;
  }
  .list-row.header:hover { background: var(--surface-2); }
  .list-row.selected { background: var(--accent-soft); }
  .list-row .col-actions {
    display: flex; gap: 2px; opacity: 0;
    justify-content: flex-end;
  }
  .list-row:hover .col-actions { opacity: 1; }
  .list-row .col-actions button {
    width: 24px; height: 24px; display: grid; place-items: center;
    border-radius: 4px; color: var(--text-muted);
  }
  .list-row .col-actions button:hover { background: var(--surface-3); color: var(--text); }
  .checkbox-cell {
    width: 16px; height: 16px;
    border: 1.5px solid var(--border-strong);
    border-radius: 4px;
    display: grid; place-items: center;
    background: var(--surface);
  }
  .list-row.selected .checkbox-cell {
    background: var(--accent); border-color: var(--accent); color: white;
  }
  .col-sort {
    display: inline-flex; align-items: center; gap: 4px;
    cursor: pointer;
  }
  .col-sort:hover { color: var(--text); }

  /* Multi-select bar */
  .multiselect-bar {
    position: absolute; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    z-index: 30;
    animation: slideUp 200ms ease;
  }
  @keyframes slideUp {
    from { transform: translate(-50%, 8px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }
  .multiselect-bar .count {
    font-size: 13px; font-weight: 500;
  }
  .multiselect-bar .sep {
    width: 1px; height: 18px; background: var(--border);
  }
  .multiselect-bar button {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; font-size: 12.5px; border-radius: 5px;
    color: var(--text-muted);
  }
  .multiselect-bar button:hover { background: var(--surface-3); color: var(--text); }
  .multiselect-bar button.danger:hover { background: oklch(94% 0.04 27); color: var(--danger); }

  /* Tweaks toggle dot in panel */
  .toolbar-divider {
    width: 1px; height: 22px; background: var(--border);
  }

  /* Drop zone hint while dragging */
  .dragging-active .card[data-droppable="true"] {
    border-color: var(--accent);
  }

  /* === CHAT VIEW === */
  .chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .chat-thread {
    flex: 1; overflow-y: auto;
    padding: 28px 0 24px;
  }
  .chat-thread::-webkit-scrollbar { width: 10px; }
  .chat-thread::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .chat-inner { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  .msg-row {
    display: flex; gap: 12px; margin: 18px 0;
  }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 10.5px; font-weight: 600; color: white;
    flex-shrink: 0;
  }
  .msg-avatar.ai { background: var(--text); color: var(--bg); }
  .msg-bubble {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px; line-height: 1.55;
    max-width: 86%;
  }
  .msg-row.ai .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .msg-row.user .msg-bubble {
    background: var(--accent);
    color: white;
    border-top-right-radius: 4px;
  }
  .msg-bubble p { margin: 0 0 8px; }
  .msg-bubble p:last-child { margin: 0; }
  .msg-bubble code {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    background: var(--surface-3); padding: 1px 5px; border-radius: 4px;
  }
  .msg-row.user .msg-bubble code { background: oklch(0% 0 0 / 0.2); }

  /* Rich markdown inside message bubbles (assistant + user) */
  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3, .msg-bubble h4 {
    line-height: 1.3; font-weight: 600; margin: 16px 0 8px;
  }
  .msg-bubble h1 { font-size: 20px; }
  .msg-bubble h2 { font-size: 17px; }
  .msg-bubble h3 { font-size: 15px; }
  .msg-bubble h4 { font-size: 14px; }
  .msg-bubble > :first-child { margin-top: 0; }
  .msg-bubble ul, .msg-bubble ol { margin: 8px 0; padding-left: 22px; }
  .msg-bubble li { margin: 3px 0; }
  .msg-bubble li > p { margin: 0; }
  .msg-bubble a { color: var(--accent); text-decoration: underline; }
  .msg-bubble hr {
    border: 0; height: 1px; background: var(--border); margin: 14px 0;
  }
  .msg-bubble blockquote {
    margin: 8px 0; padding: 2px 0 2px 12px;
    border-left: 3px solid var(--border-strong);
    color: var(--text-muted);
  }
  .msg-bubble pre {
    background: var(--surface-3); padding: 10px 12px; border-radius: 8px;
    overflow-x: auto; margin: 8px 0; font-size: 12.5px;
  }
  .msg-bubble pre code { background: transparent; padding: 0; font-size: 12.5px; }
  .msg-bubble table {
    display: block; width: max-content; max-width: 100%; overflow-x: auto;
    border-collapse: collapse; margin: 10px 0; font-size: 13px;
  }
  .msg-bubble th, .msg-bubble td {
    border: 1px solid var(--border); padding: 6px 10px; text-align: left;
  }
  .msg-bubble th { background: var(--surface-2); font-weight: 600; }
  .msg-bubble .katex-display { margin: 12px 0; overflow-x: auto; overflow-y: hidden; }

  /* Same elements on the accent-colored user bubble: keep them readable on white text */
  .msg-row.user .msg-bubble a { color: white; }
  .msg-row.user .msg-bubble hr { background: rgba(255,255,255,0.3); }
  .msg-row.user .msg-bubble blockquote { border-left-color: rgba(255,255,255,0.4); color: rgba(255,255,255,0.85); }
  .msg-row.user .msg-bubble pre { background: oklch(0% 0 0 / 0.2); }
  .msg-row.user .msg-bubble th, .msg-row.user .msg-bubble td { border-color: rgba(255,255,255,0.3); }
  .msg-row.user .msg-bubble th { background: oklch(0% 0 0 / 0.15); }

  /* Turn delete affordance */
  .turn { margin: 8px -12px; padding: 6px 12px; }
  .turn-actions {
    position: absolute; top: 8px; right: 12px;
    display: flex; gap: 4px;
    z-index: 5;
  }
  .turn-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11.5px; font-weight: 500;
    color: var(--text-muted);
    box-shadow: 0 1px 2px oklch(0% 0 0 / 0.04);
    transition: background 120ms, color 120ms, border-color 120ms;
  }
  .turn-btn:hover { background: var(--surface-3); color: var(--text); }
  .turn-btn.danger:hover {
    background: oklch(96% 0.03 27);
    color: var(--danger);
    border-color: oklch(82% 0.09 27);
  }
  [data-theme="dark"] .turn-btn.danger:hover {
    background: oklch(28% 0.06 27); border-color: oklch(40% 0.1 27);
  }
  .msg-del {
    position: absolute; top: -6px; right: -6px;
    width: 22px; height: 22px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--text-muted);
    box-shadow: 0 1px 2px oklch(0% 0 0 / 0.06);
  }
  .msg-del:hover { color: var(--danger); border-color: oklch(82% 0.09 27); }

  /* Note cells. Deliberately NOT bubble-shaped: a note is the user's own
     writing dropped into the timeline, so it reads as page text with a margin
     rule beside it, not as a chat turn. No avatar, no role label. */
  .note-row {
    display: flex; gap: 12px; margin: 18px 0;
    padding-left: 40px; /* lines the text up with the AI bubbles' left edge */
  }
  .note-block {
    flex: 1; position: relative;
    border-left: 2px solid var(--border);
    padding: 2px 0 2px 14px;
  }
  .note-row:focus-within .note-block { border-left-color: var(--accent); }
  .note-block textarea {
    display: block; width: 100%;
    background: transparent; border: 0; outline: none; resize: none;
    padding: 0; margin: 0;
    font: inherit; font-size: 14px; line-height: 1.6;
    color: var(--text);
    overflow: hidden; /* height is driven by JS to fit content */
  }
  .note-block textarea::placeholder { color: var(--text-faint); font-style: italic; }
  .note-actions {
    position: absolute; top: -2px; right: 0;
    display: flex; gap: 4px;
  }

  /* Editing an AI answer in place: the textarea takes over the bubble's box so
     the layout doesn't jump between rendered and raw views. */
  .msg-edit-area {
    display: block; width: 100%; box-sizing: border-box;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--accent); border-radius: 8px;
    padding: 8px 10px; margin: 0;
    font: inherit; font-size: 13.5px; line-height: 1.55;
    resize: none; outline: none; overflow: hidden;
    white-space: pre-wrap;
  }
  .msg-edit-bar {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px;
  }
  .msg-edit-hint { font-size: 11.5px; color: var(--text-faint); margin-right: auto; }
  .msg-edited-tag {
    font-size: 11px; color: var(--text-faint);
    margin-top: 4px; display: block;
  }

  .composer-wrap {
    flex-shrink: 0;
    padding: 0 16px 18px;
  }
  .context-strip {
    max-width: 900px; margin: 0 auto 8px;
    display: flex; align-items: center; gap: 10px;
    font-size: 11.5px; color: var(--text-faint);
    padding: 0 4px;
  }
  .context-strip .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); }
  .context-strip .right { margin-left: auto; }
  .context-strip .link { color: var(--text-muted); cursor: pointer; }
  .context-strip .link:hover { color: var(--accent); }

  .composer {
    max-width: 900px; margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: border-color 120ms, box-shadow 120ms;
  }
  .composer:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .composer textarea {
    width: 100%; resize: none; outline: 0; border: 0;
    padding: 14px 16px 8px;
    font-size: 14px; line-height: 1.5; color: var(--text);
    background: transparent;
    min-height: 56px; max-height: 180px;
  }
  .composer textarea::placeholder { color: var(--text-faint); }
  .composer-toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px 8px;
  }
  .composer-toolbar .icon-btn {
    width: 28px; height: 28px; display: grid; place-items: center;
    color: var(--text-muted); border-radius: 6px;
  }
  .composer-toolbar .icon-btn:hover { background: var(--surface-3); color: var(--text); }
  .composer-toolbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .token-est { font-size: 11px; color: var(--text-faint); }
  .send-btn {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); color: white;
    transition: opacity 120ms, transform 120ms;
  }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .send-btn:not(:disabled):hover { transform: scale(1.06); }

  /* Tweaks toggle in toolbar */
  .right-rail {
    position: absolute; top: 14px; right: 14px;
    z-index: 100;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: oklch(0% 0 0 / 0.4);
    backdrop-filter: blur(2px);
    z-index: 200;
    display: grid; place-items: center;
    animation: fadeIn 150ms ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 440px; background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    animation: scaleIn 150ms ease;
  }
  @keyframes scaleIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Context menu */
  .ctx-menu {
    position: fixed; z-index: 300;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    min-width: 180px;
    box-shadow: var(--shadow-pop);
  }
  .ctx-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px;
    font-size: 13px;
    border-radius: 5px;
    cursor: pointer;
  }
  .ctx-item:hover { background: var(--surface-3); }
  .ctx-item.danger:hover { background: oklch(95% 0.03 27); color: var(--danger); }
  .ctx-divider { height: 1px; background: var(--border); margin: 4px 0; }

  /* Toast */
  .toast-stack {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px;
    z-index: 400;
  }
  .toast {
    background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: var(--radius);
    font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-pop);
    animation: toastIn 150ms ease;
  }
  @keyframes toastIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* Quick switcher */
  .qs-modal {
    width: 540px; max-height: 60vh;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .qs-input {
    width: 100%; padding: 14px 18px;
    border: 0; outline: 0; border-bottom: 1px solid var(--border);
    font-size: 15px; background: transparent; color: var(--text);
  }
  .qs-list { flex: 1; overflow-y: auto; padding: 6px; }
  .qs-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  .qs-item.focused { background: var(--accent-soft); color: var(--accent-text); }
  .qs-item .meta { margin-left: auto; font-size: 11.5px; color: var(--text-faint); }

  /* === LANDING / LOGIN === */
  .landing { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: var(--bg); }

  /* Left: brand wordmark top, big headline mid-panel. */
  .landing-brand {
    flex: 1; display: flex; flex-direction: column;
    padding: 44px 56px;
  }
  .landing-brandbar { display: flex; align-items: center; gap: 10px; }
  .landing-brandbar .word {
    font-family: 'Poppins', 'Inter', sans-serif;
    font-weight: 700; font-size: 27px; letter-spacing: -0.01em;
  }

  .landing-pitch { margin: auto 0; max-width: 560px; }
  .landing-pitch h1 {
    font-size: clamp(60px, 3.3vw, 79px); line-height: 1.1; font-weight: 700;
    letter-spacing: -0.03em; margin: 0 0 26px;
  }
  .landing-pitch h1 .hl { color: var(--c-teal); }
  .landing-pitch .sub { font-size: 28.5px; line-height: 1.55; color: var(--text-muted); }

  /* Right: login panel */
  .landing-auth {
    flex: 1; display: grid; place-items: center; padding: 40px;
    background: oklch(58% 0.09 180 / 0.12);
  }
  .landing-card {
    width: 100%; max-width: 484px; text-align: center;
    background: var(--surface); border-radius: 16px;
    padding: 40px 32px; box-shadow: var(--shadow-pop);
  }
  .landing-card h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 10px; }
  .landing-card .lead { font-size: 22.5px; color: var(--text-muted); margin-bottom: 30px; }
  .landing-google {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; height: 54px; border-radius: 12px;
    background: var(--text); color: var(--bg);
    font-size: 23px; font-weight: 600;
    transition: filter 120ms, transform 120ms;
  }
  .landing-google:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .landing-google .g-chip {
    width: 26px; height: 26px; border-radius: 6px; background: white;
    display: grid; place-items: center;
  }
  .landing-error {
    font-size: 19px; color: var(--danger); margin-bottom: 16px;
    padding: 8px 12px; border-radius: 8px;
    background: oklch(96% 0.04 27); border: 1px solid oklch(82% 0.09 27);
  }
  [data-theme="dark"] .landing-error { background: oklch(28% 0.06 27); border-color: oklch(40% 0.1 27); }
  .landing-terms { font-size: 16px; color: var(--text-faint); margin-top: 20px; line-height: 1.5; }

  /* On narrow viewports, drop the brand panel and just show the login. */
  @media (max-width: 820px) {
    .landing-brand { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="/tweaks-panel.jsx"></script>
<script type="text/babel" src="/icons.jsx"></script>
<script type="text/babel" src="/auth-view.jsx"></script>
<script type="text/babel" src="/data.jsx"></script>
<script type="text/babel" src="/files-view.jsx"></script>
<script type="text/babel" src="/chat-view.jsx"></script>
<script type="text/babel" src="/sidebar.jsx"></script>
<script type="text/babel" src="/app.jsx"></script>
</body>
</html>
